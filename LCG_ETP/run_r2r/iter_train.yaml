BASE_TASK_CONFIG_PATH: run_r2r/r2r_vlnce.yaml
SIMULATOR_GPU_IDS: [0]
TORCH_GPU_ID: 0
TORCH_GPU_IDS: [0]
TRAINER_NAME: SS-ETP
GPU_NUMBERS: 1
NUM_ENVIRONMENTS: 1
TENSORBOARD_DIR: data/logs/tensorboard_dirs/
CHECKPOINT_FOLDER: data/logs/checkpoints/
EVAL_CKPT_PATH_DIR: data/logs/checkpoints/
RESULTS_DIR: data/logs/eval_results/
VIDEO_DIR: data/logs/video/
VIDEO_OPTION: []  # Video options: [] means no video saving, ["disk"] means save to disk, ["tensorboard"] means save to tensorboard, ["disk", "tensorboard"] means both

INFERENCE:
  SPLIT: test
  USE_CKPT_CONFIG: False
  SAMPLE: False
  CKPT_PATH: '' # REPLACE THIS
  PREDICTIONS_FILE: ''
  FORMAT: r2r
  EPISODE_COUNT: -1

EVAL:
  USE_CKPT_CONFIG: False
  SPLIT: val_unseen
  EPISODE_COUNT: -1
  EPISODE_ID: []
  CKPT_PATH_DIR: ''
  fast_eval: False

IL:
  iters: 3000  # Set a larger value when resuming training from checkpoint
  log_every: 100
  lr: 1e-6
  batch_size: 1 # equal to NUM_ENVIRONMENTS
  ml_weight: 1.0
  expert_policy: spl

  sample_ratio: 0.75
  decay_interval: 3000
  
  # Configuration for resuming training from checkpoint
  load_from_ckpt: False  # Set to True to load from checkpoint
  ckpt_to_load: 'data/logs/checkpoints/ETPNav/ckpt.iter12000.pth'  # Checkpoint path
  is_requeue: False
  
  max_traj_len: 15
  max_text_len: 80

  waypoint_aug: False
  ghost_aug: 0.0
  back_algo: teleport
  # back_algo: control
  tryout: True

  # Point cloud SFT (see MODEL.POINT_CLOUD):
  # - warmup: only pointnet_encoder + pc_feat_proj (+ fusion_lambda)
  # - align: selective unfreeze (below). Requires enable_pointnet or enable_fusion.
  # ETPNav module map:
  #   align_train_bert          -> vln_bert: embeddings, lang_encoder, img_embeddings
  #   align_train_global_encoder -> vln_bert.global_encoder (GlobalMapEncoder, global graph+text)
  #   align_train_sap           -> vln_bert.global_sap_head (node logits / SAP)
  #   align_train_pointcloud    -> pointnet_encoder, pc_feat_proj, fusion_lambda_raw
  #   align_train_rgb_encoder   -> rgb_encoder (waypoint/local views)
  #   align_train_depth_encoder -> depth_encoder
  finetune_stage: warmup
  pointnet_lr: 1e-4
  align_train_bert: false
  align_train_global_encoder: false
  align_train_sap: false
  align_train_pointcloud: true
  align_train_rgb_encoder: false
  align_train_depth_encoder: false

  warmup_iters: 500
  min_lr_ratio: 1.0

MODEL:
  task_type: r2r

  policy_name: PolicyViewSelectionETP
  NUM_ANGLES: 12
  pretrained_path: pretrained/ETP/mlm.sap_r2r/ckpts/model_step_82500.pt
  fix_lang_embedding: False
  fix_pano_embedding: False
  use_depth_embedding: True
  use_sprels: True
  merge_ghost: True
  consume_ghost: True
 
  spatial_output: False
  RGB_ENCODER:
    output_size: 512
  DEPTH_ENCODER:
    output_size: 256    
  VISUAL_DIM:
    vis_hidden: 768
    directional: 128
  INSTRUCTION_ENCODER:
    bidirectional: True

  # Ghost depth -> point cloud -> PointNet -> residual on gmap tokens (fusion_scope: connected = one-hop ghosts only)
  POINT_CLOUD:
    enable_depth_to_pointcloud: true
    enable_spatial_crop: true
    max_depth_m: 3.0
    num_points: 256
    enable_pointnet: true
    enable_fusion: true
    accumulate_mode: mean
    fusion_scope: connected
    enable_learnable_fusion_lambda: true
    fusion_lambda_init: 0.5
    fps_seed: 0
    POINTNET:
      in_dim: 3
      mlp_channels: [64, 128, 256]
      global_dim: 256
      dropout: 0.0
      use_bn: true

