BASE_TASK_CONFIG_PATH: run_r2r/r2r_vlnce.yaml
SIMULATOR_GPU_IDS: [0]
TORCH_GPU_ID: 0
TORCH_GPU_IDS: [0]

TRAINER_NAME: SS-ETP-R1
ENV_NAME: R1Env

GPU_NUMBERS: 1
NUM_ENVIRONMENTS: 1
TENSORBOARD_DIR: data/logs/tensorboard_dirs/
CHECKPOINT_FOLDER: data/logs/checkpoints/
RESULTS_DIR: data/logs/checkpoints/
ONLY_LAST_SAVEALL: True
# VIDEO_DIR: data/logs/video/
# VIDEO_OPTION: ["disk"]

INFERENCE:
  SPLIT: test
  USE_CKPT_CONFIG: False
  SAMPLE: False
  CKPT_PATH: '' # REPLACE THIS
  PREDICTIONS_FILE: ''
  FORMAT: r2r
  EPISODE_COUNT: -1

EVAL:
  USE_CKPT_CONFIG: False
  SPLIT: val_unseen
  EPISODE_COUNT: -1
  EPISODE_ID: None
  CKPT_PATH_DIR: ''
  fast_eval: False


IL:
  iters: 1000
  log_every: 50
  lr: 1e-5
  batch_size: 1 # equal to NUM_ENVIRONMENTS
  ml_weight: 1.0
  expert_policy: spl

  sample_ratio: 0.75
  decay_interval: 3000
  warmup_iters: 500
  min_lr_ratio: 1
  
  max_traj_len: 15
  max_text_len: 150
  loc_noise: 0.5
  waypoint_aug: False
  ghost_aug: 0.0
  back_algo: teleport
  # back_algo: control
  tryout: True
  
  load_from_ckpt: True
  ckpt_to_load: "data/logs/checkpoints/origin/release_r2r_grpo/store/ckpt.iter270.pth"
  # If <= 0, fallback to IL.lr
  pointnet_lr: 1e-4
  # Fine-tuning stage:
  # - warmup: freeze base, train only PointNet/fusion
  # - align:  load warmup checkpoint via ckpt_to_load, then train full model
  finetune_stage: "warmup"
  # Align-stage module switches:
  # - bert: language + panorama embedding stack
  # - dpft: original ETP-R1 DPFT/global branch modules
  # - sap:  global SAP prediction head
  # - pointcloud: newly added PointNet/fusion branch
  # RGB/Depth encoders are frozen by default.
  align_train_bert: False
  align_train_dpft: True
  align_train_sap: True
  align_train_pointcloud: True
  align_train_rgb_encoder: False
  align_train_depth_encoder: False

GRPO:
  iters: 3000
  log_every: 25
  lr: 1e-5
  batch_size: 1 # equal to NUM_ENVIRONMENTS
  
  max_traj_len: 15
  max_text_len: 150
  loc_noise: 0.5
  waypoint_aug: False
  ghost_aug: 0.0
  back_algo: teleport
  # back_algo: control
  tryout: True
  ckpt_to_load: "data/checkpoints/ckpt.0.pth"

  warmup_iters: 500
  min_lr_ratio: 1

  sample_num: 8
  grpo_epsilon: 0.2
  grpo_beta: 0.01
  max_grad_norm: 1.0
  update_epochs: 4
  dropout_rate: 0.1
  train_all: False
  enable_amp: False
  enable_all_dropouts: False
  dropout_in_sampling: False

  T_start: 2.0
  T_end: 1.0

MODEL:
  task_type: r2r
  policy_name: R1Policy

  NUM_ANGLES: 12
  pretrained_path: pretrained/ETP/mlm.sap_r2r/ckpts/model_step_82500.pt
  SAP:
    # If True, mask visited (real) nodes in global SAP scoring.
    # If False, visited nodes are also candidate targets for SAP.
    mask_visited: True
  fix_lang_embedding: False
  fix_pano_embedding: False
  use_depth_embedding: True
  use_sprels: True
  merge_ghost: True
  consume_ghost: True
  
  POINT_CLOUD:
    enable_depth_to_pointcloud: True
    enable_spatial_crop: True
    max_depth_m: 3.0
    num_points: 256
    enable_pointnet: True
    enable_fusion: True
    # connected or global
    fusion_scope: connected
    # If True, scale fusion residual by a learnable global scalar lambda in (0, 1).
    # If False, lambda is fixed to 1.0.
    enable_learnable_fusion_lambda: True
    fusion_lambda_init: 0.5
    only_candidate_views: True
    accumulate_mode: mean
    # Base seed for FPS. If < 0, fallback to TASK_CONFIG.SEED.
    fps_seed: 0
    POINTNET:
      in_dim: 3
      mlp_channels: [64, 128, 256]
      global_dim: 256
      dropout: 0.0
      use_bn: True

  DEPTH_TRUNCATION:
    # off / global / candidate
    mode: "off"
    max_depth_m: 3.0
  
  spatial_output: False
  RGB_ENCODER:
    output_size: 512
  DEPTH_ENCODER:
    output_size: 256    
  VISUAL_DIM:
    vis_hidden: 768
    directional: 128
  INSTRUCTION_ENCODER:
    bidirectional: True

